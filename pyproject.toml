[project]
name = "bounty-board"
version = "0.1.0"
description = "A Switch room where a person and three AI agents run a hackathon/bounty pipeline together"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
bounty-board = "bounty_board.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
